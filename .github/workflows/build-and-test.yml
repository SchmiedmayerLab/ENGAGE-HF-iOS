name: Build and Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: Build-and-Test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildandtest:
    name: Build and Test
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild-or-fastlane.yml@v0.5
    permissions:
      contents: read
    with:
      artifactname: ENGAGEHF.xcresult
      runsonlabels: '["macOS", "self-hosted"]'
      fastlanelane: test
      firebaseemulatorimport: ./firebase
      firebasejsonpath: ./ENGAGE-HF-Firebase/firebase.json
      setupfirebaseemulator: true
      checkout_submodules: true
      customcommand: npm --prefix ENGAGE-HF-Firebase run prepare && firebase emulators:exec -c ./ENGAGE-HF-Firebase/firebase.json --export-on-exit=./firebase 'npm --prefix ./ENGAGE-HF-Firebase/functions run serve:seed && sleep 10'
    secrets:
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}
  uploadcoveragereport:
    name: Upload Coverage Report
    needs: buildandtest
    uses: SchmiedmayerLab/.github/.github/workflows/coverage.yml@v0.5
    permissions:
      contents: read
      actions: read
    with:
      coveragereports: ENGAGEHF.xcresult
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
